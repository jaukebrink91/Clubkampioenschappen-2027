<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo Clubtoernooi 2027</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#dde3ea;--brand:#1f4e79;--brand-ink:#fff;--lab:#eef1f4;
--tennis:#1f4e79;--padel:#2e7d32;--win:#2fa84f;--loss:#c0392b;--accent:#fff3cd;--accent-line:#e0b100;--chip:#e8eef5;--cta:#0a9fe0}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#18202a;--ink:#e6edf3;--muted:#9aa8b6;--line:#2a3542;--lab:#202a35;
--brand:#3a74a8;--chip:#223040;--tennis:#5b9bd5;--padel:#5cb860;--accent:#3a3216;--accent-line:#a68a1c}}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--brand);color:var(--brand-ink);padding:16px}header h1{margin:0;font-size:20px}
header .upd{opacity:.85;font-size:12px;margin-top:4px}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding:0 8px}
nav button{border:0;background:none;color:var(--muted);padding:12px 10px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
input[type=search],select{padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#q{width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar input{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--cta);color:#fff}
.sugg{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
h2{font-size:18px;margin:18px 0 8px}h3.time{font-size:16px;margin:18px 0 6px}
.row{display:grid;grid-template-columns:210px 1fr auto;background:var(--card);border:1px solid var(--line);border-radius:6px;margin:6px 0;overflow:hidden}
.lab{background:var(--lab);padding:8px 10px;border-left:4px solid var(--tennis);font-size:13px}.row.padel .lab{border-left-color:var(--padel)}
.lab b{display:block;font-weight:600}.lab span{display:block;color:var(--muted);font-size:12px}
.mt{display:grid;grid-template-columns:1fr 16px 1fr;align-items:center;padding:6px 10px;gap:4px}
.side{line-height:1.35}.side.a{text-align:right}.side.win{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--win);margin:0 6px;vertical-align:middle}
.dash{text-align:center;color:var(--muted)}.me{text-decoration:underline;text-decoration-color:var(--cta);text-underline-offset:3px}
.sc{display:flex;gap:12px;align-items:center;padding:6px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc b{font-weight:800}.sc .wo{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;color:#fff}
.badge.W{background:var(--win)}.badge.V{background:var(--loss)}.badge.K{background:var(--chip);color:var(--ink)}
.lab .badge{display:inline-block;color:#fff;font-weight:600}.lab .badge.K{color:var(--ink)}
@media (max-width:640px){.row{grid-template-columns:1fr}.mt{grid-template-columns:1fr;gap:2px}
.side.a{text-align:left}.dash{display:none}.side.b{border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.sc{padding:0 10px 8px;justify-content:flex-start}}
.rain{background:var(--accent);border:1px solid var(--accent-line);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl th{background:var(--chip);font-weight:600}.tbl td:first-child,.tbl th:first-child{text-align:center;width:32px}
.hist{white-space:nowrap;text-align:left!important}
.hc{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;text-align:center;font-size:11px;font-weight:700;color:#fff;margin-right:2px}
.hc.W{background:var(--win)}.hc.V{background:var(--loss)}
.grid{border-collapse:collapse;min-width:100%;font-size:12px;background:var(--card)}
.grid th,.grid td{border:1px solid var(--line);padding:4px;vertical-align:top;min-width:120px}
.grid th{background:var(--chip)}.grid td.t{min-width:50px;font-weight:700;text-align:center}
.gc{border-left:3px solid var(--tennis);padding-left:4px}.gc.padel{border-left-color:var(--padel)}.gc .s{color:var(--muted)}
.pod{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.pod div{padding:2px 0}.pod .l{display:inline-block;min-width:120px;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:10px 0}
.cta{display:inline-block;background:var(--cta);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px;font-size:16px}
.ent{columns:2 260px;margin:4px 0 0;padding-left:18px}.ent li{break-inside:avoid;margin:2px 0}
.muted{color:var(--muted)}.ins{margin:4px 0 10px;padding-left:18px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media print{nav,.bar,#q,.sugg,.btn{display:none}}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={};D.players.forEach(p=>P[p.id]=p);
let me=null,view='l',day=D.today>=0?D.today:0;
$('title').textContent=D.name;$('upd').textContent='Laatst bijgewerkt: '+D.updated;document.title=D.name;
function tab(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function sortM(a,b){return (a.d<0?99:a.d)-(b.d<0?99:b.d)||a.t.localeCompare(b.t)||a.p-b.p||a.c.localeCompare(b.c,undefined,{numeric:true});}
function nm(ids,txt){return ids.length?ids.map(i=>'<span'+(i===me?' class="me"':'')+'>'+esc(P[i].n)+'</span>').join('<br>'):esc(txt);}
function score(m){
 if(m.wo)return '<span class="wo">w.o.</span>';
 return m.sets.map(s=>'<span>'+(s[0]>s[1]?'<b>'+s[0]+'</b>':s[0])+' - '+(s[1]>s[0]?'<b>'+s[1]+'</b>':s[1])+'</span>').join('');}
function row(m,opt){
 opt=opt||{};
 const lab1=m.pool?esc(m.g)+' - Groep '+esc(m.pool):esc(m.g);
 let lab2=esc(m.rd);
 if(opt.when)lab2=(m.d<0?'tijd volgt':esc(D.days[m.d])+' '+m.t)+' &middot; '+esc(m.c||'')+'<br>'+lab2;
 else if(opt.court)lab2+=' &middot; '+esc(m.c);
 let badge='';
 if(opt.mine&&m.w){const mine=m.pa.includes(me)?1:2;badge='<span class="badge '+(m.w===mine?'W':'V')+'">'+(m.w===mine?'gewonnen':'verloren')+'</span>';}
 else if(opt.mine&&!m.pa.includes(me)&&!m.pb.includes(me))badge='<span class="badge K">als je doorgaat</span>';
 return '<div class="row'+(m.p?' padel':'')+'"><div class="lab"><b>'+lab1+badge+'</b><span>'+lab2+'</span></div>'+
  '<div class="mt"><div class="side a'+(m.w===1?' win':'')+'">'+(m.w===1?'<i class="dot"></i>':'')+nm(m.pa,m.a)+'</div><div class="dash">-</div>'+
  '<div class="side b'+(m.w===2?' win':'')+'">'+nm(m.pb,m.b)+(m.w===2?'<i class="dot"></i>':'')+'</div></div><div class="sc">'+score(m)+'</div></div>';}
function showMe(){
 const box=$('mine');
 if(me===null||!P[me]){box.innerHTML='<p class="muted">Zoek hierboven op je naam om je wedstrijden te zien. Tip: zet deze pagina op het beginscherm van je telefoon.</p>';return;}
 const p=P[me];
 const list=D.matches.filter(m=>m.pa.includes(me)||m.pb.includes(me)||(m.pos||[]).includes(me)).sort(sortM);
 let h='<h2>'+esc(p.n)+' <button class="btn" id="other">andere speler</button></h2>';
 h+='<div class="muted">Ingeschreven voor:</div><ul class="ins">'+p.ins.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 if(D.rain.length)h+='<div class="rain">Let op: door regen zijn er wedstrijden verplaatst. Controleer je tijden.</div>';
 h+=list.length?list.map(m=>row(m,{when:1,mine:1})).join(''):'<p class="muted">Het wedstrijdschema volgt binnenkort.</p>';
 box.innerHTML=h;$('other').onclick=()=>{me=null;save();$('q').value='';showMe();$('q').focus();};}
function save(){try{if(me===null)localStorage.removeItem('speler');else localStorage.setItem('speler',me);}catch(e){}
 try{history.replaceState(null,'',me===null?location.pathname:'#speler='+me);}catch(e){}}
$('q').addEventListener('input',()=>{
 const q=$('q').value.trim().toLowerCase(),s=$('sugg');
 if(q.length<2){s.hidden=true;return;}
 const hits=D.players.filter(p=>p.n.toLowerCase().includes(q)).slice(0,12);
 s.innerHTML=hits.length?hits.map(p=>'<button data-id="'+p.id+'">'+esc(p.n)+'</button>').join(''):'<div style="padding:10px" class="muted">Geen speler gevonden</div>';
 s.hidden=false;
 s.querySelectorAll('button').forEach(b=>b.onclick=()=>{me=+b.dataset.id;s.hidden=true;$('q').value='';save();showMe();});});

function showProg(){
 $('days').innerHTML=D.days.map((d,i)=>'<button data-d="'+i+'"'+(i===day?' class="on"':'')+'>'+esc(d)+'</button>').join('');
 $('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{day=+b.dataset.d;showProg();});
 const loc=$('loc').value,q=$('pq').value.trim().toLowerCase();
 const hit=m=>!q||m.pa.concat(m.pb).some(i=>P[i].n.toLowerCase().includes(q))||m.a.toLowerCase().includes(q)||m.b.toLowerCase().includes(q);
 const list=D.matches.filter(m=>m.d===day&&(loc===''||m.p===+loc)&&hit(m)).sort(sortM);
 let h=D.rain.filter(x=>x.d===day).map(x=>'<div class="rain">'+esc(x.txt)+'</div>').join('');
 if(!list.length){$('prog').innerHTML=h+'<p class="muted">Geen wedstrijden gevonden.</p>';return;}
 if(view==='l'){let last='';list.forEach(m=>{if(m.t!==last){h+='<h3 class="time">'+m.t+'</h3>';last=m.t;}h+=row(m,{court:1});});}
 else{
  const courts=[];D.courts.forEach(c=>{if(loc===''||c.p===+loc)courts.push(c);});
  const times=[...new Set(list.map(m=>m.t))].sort();
  h+='<div class="tw"><table class="grid"><tr><th>Tijd</th>'+courts.map(c=>'<th>'+esc(c.n)+'</th>').join('')+'</tr>';
  times.forEach(t=>{h+='<tr><td class="t">'+t+'</td>'+courts.map(c=>{const m=list.find(x=>x.t===t&&x.c===c.n);
   return '<td>'+(m?'<div class="gc'+(m.p?' padel':'')+'"><div class="s">'+esc(m.g)+(m.pool?' - '+esc(m.pool):'')+' &middot; '+esc(m.rd)+'</div><div>'+nm(m.pa,m.a)+'</div><div class="s">tegen</div><div>'+nm(m.pb,m.b)+'</div>'+(m.r?'<div><b>'+esc(m.r)+'</b></div>':'')+'</div>':'')+'</td>';}).join('')+'</tr>';});
  h+='</table></div>';}
 $('prog').innerHTML=h;}
$('loc').onchange=showProg;$('pq').oninput=showProg;
$('vl').onclick=()=>{view='l';$('vl').classList.add('on');$('vg').classList.remove('on');showProg();};
$('vg').onclick=()=>{view='g';$('vg').classList.add('on');$('vl').classList.remove('on');showProg();};
function pod(g){return g.pod.length?'<div class="pod">'+g.pod.map(x=>'<div><span class="l">'+esc(x.l)+'</span>'+esc(x.t)+'</div>').join('')+'</div>':'<p class="muted">Nog niet bekend.</p>';}
$('grp').innerHTML=D.groups.map((g,i)=>'<option value="'+i+'">'+esc(g.n)+'</option>').join('');
function showStand(){
 const g=D.groups[+$('grp').value];if(!g){$('grp').hidden=true;$('stand').innerHTML='<p class="muted">De groepen zijn nog niet ingedeeld.</p>';return;}
 let h='';
 g.pools.forEach(p=>{h+='<h2>'+esc(g.n)+' - Groep '+esc(p.n)+'</h2><div class="tw"><table class="tbl"><tr><th>#</th><th>Spelers</th><th>GS</th><th>W</th><th>V</th><th>PT</th><th>Sets</th><th>Games</th><th>Historie</th></tr>'+
  p.rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.t)+'</td><td>'+r.gs+'</td><td>'+r.w+'</td><td>'+r.v+'</td><td><b>'+r.w+'</b></td><td>'+r.s+'</td><td>'+r.g+'</td><td class="hist">'+
  r.h.split('').map(c=>'<span class="hc '+c+'">'+c+'</span>').join('')+'</td></tr>').join('')+'</table></div>';
  h+=D.matches.filter(m=>m.gi===g.i&&m.pool===p.n).sort(sortM).map(m=>row(m,{when:1})).join('');});
 const ko=D.matches.filter(m=>m.gi===g.i&&m.ko).sort(sortM);
 if(ko.length)h+='<h2>'+esc(g.n)+' - Playoff</h2>'+ko.map(m=>row(m,{when:1})).join('');
 h+='<h2>Eindresultaat</h2>'+pod(g);$('stand').innerHTML=h;}
$('grp').onchange=showStand;
$('win').innerHTML=D.groups.length?D.groups.map(g=>'<h2>'+esc(g.n)+'</h2>'+pod(g)).join(''):'<p class="muted">Nog niet bekend.</p>';
$('ent').innerHTML=(D.entries.length?'<p class="muted">'+D.nEntries+' inschrijvingen, '+D.players.length+' spelers.</p>'+D.entries.map(e=>'<h2>'+esc(e.n)+' <span class="muted">('+e.t.length+')</span></h2><ul class="ent">'+
 e.t.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>').join(''):'<p class="muted">Nog geen inschrijvingen.</p>');
(function(){const r=D.reg;let h='<div class="box">';
 if(r.open&&r.url){h+='<h2 style="margin-top:0">Aanmelden voor '+esc(D.name)+'</h2>'+(r.close?'<p>Aanmelden kan tot <b>'+esc(r.close)+'</b>.</p>':'')+
  '<p>Je kunt je voor maximaal '+r.max+' onderdelen aanmelden. Bij een dubbel vul je de naam van je partner in; je partner hoeft zich niet apart aan te melden. Heb je nog geen partner? Laat het veld leeg, dan zoeken wij er een.</p>'+
  '<p>Inschrijfgeld: '+esc(r.fee)+'.</p><p><a class="cta" href="'+encodeURI(r.url)+'" target="_blank" rel="noopener">Naar het aanmeldformulier</a></p>';}
 else if(r.open)h+='<p class="muted">Aanmelden is nog niet geopend.</p>';
 else h+='<p>De inschrijving is gesloten en de groepen zijn ingedeeld. Kijk bij <b>Mijn wedstrijden</b> wanneer je speelt.</p>';
 $('reg').innerHTML=h+'</div>';if(!r.open&&!r.url)$('tabreg').hidden=true;})();
const hm=location.hash.match(/speler=(\d+)/);let st=null;try{st=localStorage.getItem('speler');}catch(e){}
me=hm?+hm[1]:(st!==null?+st:null);
showMe();showProg();showStand();
if(!D.matches.length&&D.reg.open&&D.reg.url)tab('reg');
